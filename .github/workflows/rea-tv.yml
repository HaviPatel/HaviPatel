name: REA TV

on:
  push:
    paths:
      - "rea-tv/**"
      - ".github/workflows/rea-tv.yml"
    tags:
      - "rea-tv-v*"
  pull_request:
    paths:
      - "rea-tv/**"
      - ".github/workflows/rea-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rea-tv
    env:
      REA_KEYSTORE_BASE64: ${{ secrets.REA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use release signing key (optional secret)
        if: env.REA_KEYSTORE_BASE64 != ''
        run: |
          echo "$REA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rea-release.jks"
          echo "REA_KEYSTORE=$RUNNER_TEMP/rea-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          REA_KEYSTORE_PASSWORD: ${{ secrets.REA_KEYSTORE_PASSWORD }}
          REA_KEY_ALIAS: ${{ secrets.REA_KEY_ALIAS }}
          REA_KEY_PASSWORD: ${{ secrets.REA_KEY_PASSWORD }}
          # Optional: bakes a TMDB key in, so the Top Shelf shows series and movies out of the box.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          ./gradlew --no-daemon assembleRelease
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "REA-TV-v${version}.apk"
          ls -l REA-TV-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: REA-TV-apk
          path: |
            rea-tv/REA-TV-*.apk
            rea-tv/scripts/
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/rea-tv-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rea-tv/REA-TV-*.apk
            rea-tv/scripts/rea.sh
            rea-tv/scripts/rea.ps1
            rea-tv/scripts/debloat-packages.txt
